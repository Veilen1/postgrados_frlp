# =============================================================================
# Orquestación Docker Compose Hardened — Sistema de Posgrado UTN FRLP
# Stack Canónico: PostgreSQL 16 Alpine + FastAPI 3.12 + React 19 Vite
# =============================================================================

services:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. BASE DE DATOS: PostgreSQL 16 Alpine (Aislada en red backend)
  # ───────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: postgrado-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DB_USER:-postgrado_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrado_dev_password}
      POSTGRES_DB: ${DB_NAME:-postgrado_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Expuesto solo a localhost para debugging seguro desde el host (evita exposición en LAN)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgrado-pgdata:/var/lib/postgresql/data
      - ./docker/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgrado_user} -d ${DB_NAME:-postgrado_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend_net

  # ───────────────────────────────────────────────────────────────────────────
  # 2. BACKEND API: FastAPI / Python 3.12 (Multi-Stage Hardened)
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
      target: development
    container_name: postgrado-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgrado_user}:${DB_PASSWORD:-postgrado_dev_password}@db:5432/${DB_NAME:-postgrado_dev}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_for_dev_mode_utn_posgrado_2026_at_least_32_chars}
      STORAGE_PATH: ${STORAGE_PATH:-/var/postgrado-storage}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      # Montaje de código para desarrollo con live-reload sin romper paquetes instalados
      - ./app/backend/src:/app/src
      - postgrado-storage:/var/postgrado-storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend_net
      - frontend_net

  # ───────────────────────────────────────────────────────────────────────────
  # 3. FRONTEND: React 19 + TypeScript + Vite (Multi-Stage)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      target: development
    container_name: postgrado-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    volumes:
      - ./app/frontend/src:/app/src
      - ./app/frontend/index.html:/app/index.html:ro
    networks:
      - frontend_net

# ─────────────────────────────────────────────────────────────────────────────
# REDES SEGMENTADAS (Principio de Aislamiento de Red)
# ─────────────────────────────────────────────────────────────────────────────
networks:
  # Red interna entre Frontend y Backend
  frontend_net:
    driver: bridge
  # Red interna entre Backend y Base de Datos (Frontend NO tiene acceso directo a Postgres)
  backend_net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# VOLÚMENES PERSISTENTES
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgrado-pgdata:
    name: postgrado-pgdata
  postgrado-storage:
    name: postgrado-storage
